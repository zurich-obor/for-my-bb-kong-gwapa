<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>For My Endless Love ✨</title>
  
  <!-- Romantic Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Great+Vibes&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    /* ==========================================
       1. STRICT OVERFLOW & ZERO SCROLLBAR CONTROL
       ========================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden !important;
      position: fixed;
      top: 0;
      left: 0;
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
    }

    html::-webkit-scrollbar, body::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }

    /* ==========================================
       2. LUXURY DEEP VELVET BACKGROUND
       ========================================== */
    body {
      font-family: 'Montserrat', sans-serif;
      background: radial-gradient(circle at center, #320318 0%, #120008 70%, #050002 100%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* ==========================================
       3. SPLASH SCREEN (ENTRY PAGE)
       ========================================== */
    #splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 100;
      background: radial-gradient(circle at center, rgba(50, 3, 24, 0.95) 0%, rgba(5, 0, 2, 0.98) 100%);
      backdrop-filter: blur(25px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1), transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #splash.hide {
      opacity: 0;
      transform: scale(1.15);
      pointer-events: none;
    }

    .splash-seal {
      font-size: 4rem;
      margin-bottom: 1rem;
      animation: pulseHeart 2s infinite ease-in-out;
      filter: drop-shadow(0 0 20px rgba(255, 75, 114, 0.8));
    }

    .splash-title {
      font-family: 'Great Vibes', cursive;
      font-size: 3.5rem;
      background: linear-gradient(135deg, #fff 0%, #ffe3ec 40%, #ffd700 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
      text-shadow: 0 0 30px rgba(255, 215, 0, 0.2);
    }

    .splash-sub {
      font-family: 'Cinzel', serif;
      font-size: 0.85rem;
      letter-spacing: 4px;
      color: rgba(255, 215, 0, 0.8);
      margin-bottom: 2.5rem;
      text-transform: uppercase;
    }

    .splash-btn {
      position: relative;
      background: linear-gradient(135deg, #ffd700 0%, #d4af37 50%, #aa7c11 100%);
      color: #1a000c;
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 2px;
      padding: 1.1rem 2.8rem;
      border-radius: 50px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      cursor: pointer;
      box-shadow: 
        0 0 25px rgba(255, 215, 0, 0.5),
        0 10px 30px rgba(0, 0, 0, 0.5);
      transition: all 0.4s ease;
    }

    .splash-btn:hover {
      transform: scale(1.06);
      box-shadow: 
        0 0 40px rgba(255, 215, 0, 0.8),
        0 12px 35px rgba(0, 0, 0, 0.6);
    }

    /* ==========================================
       4. MAIN EXTRAVAGANT CARD
       ========================================== */
    .card {
      position: relative;
      z-index: 10;
      background: rgba(35, 5, 20, 0.55);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-radius: 32px;
      padding: 2.5rem 2rem;
      max-width: 440px;
      width: 88vw;
      text-align: center;
      border: 1px solid rgba(255, 215, 0, 0.35);
      box-shadow: 
        0 30px 60px rgba(0, 0, 0, 0.9),
        inset 0 0 25px rgba(255, 182, 193, 0.1),
        0 0 40px rgba(255, 75, 114, 0.25);
      opacity: 0;
      transform: translateY(30px) scale(0.95);
      transition: opacity 1.2s ease 0.4s, transform 1.2s ease 0.4s;
    }

    .card.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* Glowing Profile Halo */
    .avatar-box {
      position: relative;
      width: 125px;
      height: 125px;
      margin: 0 auto 1.5rem;
    }

    .profile-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      position: relative;
      z-index: 2;
      border: 2px solid #ffd700;
    }

    .halo {
      position: absolute;
      top: -8px; left: -8px; right: -8px; bottom: -8px;
      border-radius: 50%;
      background: linear-gradient(45deg, #ff3366, #ffd700, #ff8da1, #ffd700);
      z-index: 1;
      animation: spinHalo 6s linear infinite;
      filter: blur(6px);
      opacity: 0.85;
    }

    @keyframes spinHalo {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    h1 {
      font-family: 'Great Vibes', cursive;
      font-size: 2.8rem;
      font-weight: 400;
      background: linear-gradient(135deg, #ffffff 0%, #ffe3ec 50%, #ffd700 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.2rem;
    }

    .subtitle {
      font-family: 'Cinzel', serif;
      font-size: 0.75rem;
      letter-spacing: 3px;
      color: rgba(255, 215, 0, 0.75);
      margin-bottom: 1.5rem;
      text-transform: uppercase;
    }

    /* Reason Box */
    .reason-box {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 215, 0, 0.2);
      border-radius: 20px;
      padding: 1.2rem;
      height: 105px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.5rem;
      font-size: 1rem;
      font-weight: 300;
      line-height: 1.5;
      color: #fff0f5;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      transition: opacity 0.35s ease, transform 0.35s ease;
      box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.5);
    }

    .reason-box.fade {
      opacity: 0;
      transform: scale(0.95);
    }

    /* Main Action Button */
    .btn {
      background: linear-gradient(135deg, #ff2a5f 0%, #b80e38 50%, #7a001e 100%);
      color: #fff;
      font-family: 'Cinzel', serif;
      font-size: 0.85rem;
      letter-spacing: 1px;
      font-weight: 700;
      border: 1px solid rgba(255, 215, 0, 0.4);
      padding: 1rem 2.2rem;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 
        0 8px 25px rgba(255, 42, 95, 0.5),
        0 0 15px rgba(255, 215, 0, 0.2);
      transition: all 0.3s ease;
    }

    .btn:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 
        0 12px 30px rgba(255, 42, 95, 0.7),
        0 0 25px rgba(255, 215, 0, 0.5);
    }

    .btn:active {
      transform: translateY(1px) scale(0.98);
    }

    .footer {
      position: absolute;
      bottom: 1.2rem;
      font-family: 'Cinzel', serif;
      font-size: 0.7rem;
      letter-spacing: 2px;
      color: rgba(255, 215, 0, 0.4);
      z-index: 10;
    }

    @keyframes pulseHeart {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }
  </style>
</head>
<body>

  <!-- Particle Background Canvas -->
  <canvas id="canvas"></canvas>

  <!-- SPLASH SCREEN -->
  <div id="splash">
    <div class="splash-seal">💌</div>
    <h1 class="splash-title">A Private Message</h1>
    <p class="splash-sub">Dedicated to my favorite person</p>
    <button class="splash-btn" onclick="unlockSite()">
      Unlock My Heart ✨
    </button>
  </div>

  <!-- MAIN CARD -->
  <div class="card" id="mainCard">
    <div class="avatar-box">
      <div class="halo"></div>
      <!-- Replace image URL with her photo -->
      <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400" alt="Her Photo" class="profile-img">
    </div>

    <h1>Hey [Her Name] 💕</h1>
    <p class="subtitle">A Symphony of Reasons</p>

    <div class="reason-box" id="reasonText">
      Click the button below to reveal another reason why you have my whole heart... ✨
    </div>

    <button class="btn" onclick="nextReason(event)">
      Reveal Reason ❤️
    </button>
  </div>

  <div class="footer">
    FOREVER & ALWAYS YOURS
  </div>

  <script>
    // --- REASONS LIST ---
    const reasons = [
      "Your smile single-handedly turns my worst days into pure sunshine.",
      "The adorable, genuine way you laugh at my silly jokes.",
      "You inspire me every single day to dream bigger and love deeper.",
      "How gentle, caring, and unbelievably thoughtful you are.",
      "The magical spark in your eyes when you talk about what you love.",
      "You are not just my girlfriend; you are my best friend and soulmate.",
      "Your warm hugs feel like home, no matter where we are in the world.",
      "Your grace, beauty, and kind spirit leave me utterly breathless."
    ];

    let lastIndex = -1;

    // --- SYNTHESIZED ROMANTIC HARP CHIME AUDIO (Zero assets needed) ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playChimeNote(freq, delay, duration) {
      setTimeout(() => {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      }, delay);
    }

    function playDreamyArpeggio() {
      const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51]; // C Major Romantic Arpeggio
      notes.forEach((freq, i) => playChimeNote(freq, i * 120, 1.8));
    }

    // --- SPLASH UNLOCK ACTION ---
    function unlockSite() {
      playDreamyArpeggio();
      document.getElementById('splash').classList.add('hide');
      document.getElementById('mainCard').classList.add('show');
    }

    // --- REASON REVEAL ACTION ---
    function nextReason(e) {
      playChimeNote(880, 0, 1.2); // Soft chime on click
      if (e) createBurst(e.clientX, e.clientY);

      const box = document.getElementById('reasonText');
      box.classList.add('fade');

      setTimeout(() => {
        let idx;
        do {
          idx = Math.floor(Math.random() * reasons.length);
        } while (idx === lastIndex && reasons.length > 1);
        
        lastIndex = idx;
        box.innerText = reasons[idx];
        box.classList.remove('fade');
      }, 350);
    }

    // --- CANVAS PARTICLES SYSTEM (Rose Petals & Gold Stardust) ---
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let width, height, particles = [];

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class Particle {
      constructor(x, y, isBurst = false) {
        this.reset(x, y, isBurst);
      }

      reset(x, y, isBurst = false) {
        this.x = x || Math.random() * width;
        this.y = y || (isBurst ? y : -20);
        this.size = isBurst ? Math.random() * 6 + 3 : Math.random() * 5 + 2;
        this.speedY = isBurst ? (Math.random() - 0.5) * 7 : Math.random() * 1.2 + 0.5; // Falling downward
        this.speedX = isBurst ? (Math.random() - 0.5) * 7 : Math.sin(Math.random() * 10) * 0.8;
        this.rotation = Math.random() * 360;
        this.rotSpeed = (Math.random() - 0.5) * 2;
        this.opacity = isBurst ? 1 : Math.random() * 0.7 + 0.3;
        this.fade = isBurst ? Math.random() * 0.025 + 0.015 : 0;
        this.color = ['#ff3366', '#ffd700', '#ff8da1', '#ffffff', '#e60039'][Math.floor(Math.random() * 5)];
        this.type = Math.random() > 0.4 ? 'petal' : 'star';
      }

      update() {
        this.x += this.speedX + Math.sin(this.y * 0.01) * 0.5;
        this.y += this.speedY;
        this.rotation += this.rotSpeed;

        if (this.fade > 0) {
          this.opacity -= this.fade;
        } else if (this.y > height + 20) {
          this.reset();
        }
      }

      draw() {
        if (this.opacity <= 0) return;
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate((this.rotation * Math.PI) / 180);
        ctx.globalAlpha = this.opacity;
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 12;
        ctx.shadowColor = this.color;

        if (this.type === 'petal') {
          // Oval Rose Petal shape
          ctx.beginPath();
          ctx.ellipse(0, 0, this.size, this.size * 1.8, 0, 0, Math.PI * 2);
          ctx.fill();
        } else {
          // Golden Sparkle
          ctx.beginPath();
          ctx.arc(0, 0, this.size * 0.6, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }
    }

    // Populate ambient particles
    for (let i = 0; i < 60; i++) {
      particles.push(new Particle(Math.random() * width, Math.random() * height));
    }

    function createBurst(x, y) {
      for (let i = 0; i < 30; i++) {
        particles.push(new Particle(x, y, true));
      }
    }

    function animate() {
      ctx.clearRect(0, 0, width, height);
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw();
        if (particles[i].fade > 0 && particles[i].opacity <= 0) {
          particles.splice(i, 1);
        }
      }
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
